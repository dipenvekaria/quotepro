[project]
name = "quotepro"
version = "2.0.0"
description = "QuotePro backend — AI-powered quote generation for field service contractors."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Dipen Vekaria" }]

dependencies = [
    # Web
    "fastapi>=0.118.3,<1",
    "uvicorn[standard]>=0.38.0,<1",
    "python-multipart>=0.0.19",
    "sse-starlette>=3.0.3",
    "httpx>=0.28.1",

    # Config, validation, logging
    "pydantic>=2.12.0,<3",
    "pydantic-settings>=2.6.1",
    "python-dotenv>=1.0.1",
    "structlog>=24.4.0",
    "orjson>=3.10.11",
    "PyYAML>=6.0.2",

    # Auth
    "PyJWT[crypto]>=2.10.1",

    # Database
    "supabase>=2.10.0",
    "asyncpg>=0.30.0",

    # AI
    "google-adk==1.20.0",
    "google-generativeai>=0.8.5",
    "google-genai>=1.53.0",

    # Rate limiting + background jobs
    "slowapi>=0.1.9",
    "arq>=0.26.3",
    "redis>=5.2.1",

    # Integrations
    "resend>=2.19.0",
    "twilio>=9.4.0",
    "stripe>=11.5.0",

    # Observability
    "opentelemetry-api>=1.37.0",
    "opentelemetry-sdk>=1.37.0",
    "opentelemetry-instrumentation-fastapi>=0.58b0",
    "opentelemetry-instrumentation-httpx>=0.58b0",
    "opentelemetry-instrumentation-asyncpg>=0.58b0",
    "opentelemetry-exporter-otlp-proto-http>=1.37.0",
    "sentry-sdk[fastapi]>=2.19.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.3",
    "pytest-cov>=4.1.0",
    "pytest-httpx>=0.35.0",
    "ruff>=0.7.4",
    "mypy>=1.13.0",
    "schemathesis>=3.39.0",
    "types-PyYAML",
    "types-redis",
]

[project.scripts]
quotepro-api = "quotepro.main:cli_main"
quotepro-worker = "quotepro.workers.indexer_worker:cli_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quotepro"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.3",
    "pytest-cov>=4.1.0",
    "pytest-httpx>=0.35.0",
    "ruff>=0.7.4",
    "mypy>=1.13.0",
    "schemathesis>=3.39.0",
]

# ---------------------------------------------------------------------------
# Ruff — lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [
    "app",           # legacy — retained for reference until Phase 2 cutover
    "api",           # legacy
    "config",        # legacy
    "db",            # legacy
    "services",      # legacy
    "quote_indexer.py",
    "catalog_indexer.py",
    "auto_indexer.py",
    "check_db.py",
    "main.py",       # legacy entrypoint, replaced by src/quotepro/main.py
    "venv",
    ".venv",
]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # bugbear
    "SIM",   # simplify
    "TID",   # tidy-imports
    "C4",    # comprehensions
    "PIE",   # misc
    "PT",    # pytest style
    "RUF",   # ruff-specific
    "ASYNC", # async-friendly
]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # function calls in Depends() defaults are idiomatic
    "N818",  # exception naming
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "N802", "N806"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = false                # start lenient; ratchet in Phase 7
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = false
files = ["src/quotepro", "tests"]
exclude = [
    "app/",
    "api/",
    "config/",
    "db/",
    "services/",
    "venv/",
    ".venv/",
]

[[tool.mypy.overrides]]
module = ["google.*", "supabase.*", "gotrue.*", "postgrest.*", "storage3.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "--cov=src/quotepro",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=0",   # ratchet up as tests land in Phase 7
]
markers = [
    "unit: unit tests (fast, no external deps)",
    "integration: integration tests (require DB / network)",
    "contract: contract tests (Schemathesis vs OpenAPI)",
    "slow: slow tests (>1s)",
]
filterwarnings = [
    "ignore::DeprecationWarning:google.*",
    "ignore::PendingDeprecationWarning:starlette.*",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/quotepro"]
branch = true
omit = [
    "src/quotepro/workers/scheduler.py",
    "*/tests/*",
]

[tool.coverage.report]
exclude_also = [
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "\\.\\.\\.$",
]

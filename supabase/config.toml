# QuotePro — local Supabase config
# Docs: https://supabase.com/docs/guides/local-development/cli/config

project_id = "quotepro"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/**",
  "http://127.0.0.1:3000/**",
  "https://*.trycloudflare.com/**",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

# Instant signup for local dev — no email confirmation loop.
enable_signup = true
enable_manual_linking = false
enable_anonymous_sign_ins = false

[auth.rate_limit]
# Local dev only: GoTrue's built-in mailer defaults to 2 emails/hour, which
# makes the password-reset flow untestable on the second try.
email_sent = 100

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false
max_frequency = "1s"
otp_length = 6

[auth.email.template.recovery]
subject = "Reset your QuotePro password"

[auth.sms]
enable_signup = false
enable_confirmations = false

[edge_runtime]
enabled = false

# Analytics is dead weight locally and its health check flakes on macOS,
# taking storage down with it when it fails. Off on purpose.
[analytics]
enabled = false

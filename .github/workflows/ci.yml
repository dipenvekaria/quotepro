name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# This pipeline reflects what the repo actually runs today: npm, eslint, and a
# typecheck scoped to live code via tsconfig.ci.json.
#
# The target toolchain is pnpm + biome + vitest + uv + ruff (docs/adr/0006).
# Swap this file over as part of Cleanup Phase 3 — not before, or CI goes red on
# tooling that isn't installed yet.

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      # Scoped to the live app. The pre-rebuild tree does not compile — that is
      # why next.config.ts still sets ignoreBuildErrors. See docs/CODEBASE_MAP.md.
      - name: Typecheck (live code)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The integration suite needs a real database. It exists because an
      # invitation bug reached production that no pure-function test could have
      # caught — an owner opening their own invite link was demoted, leaving a
      # company with no owner. Tests that cannot run in CI protect nothing, so
      # Supabase starts here.
      - name: Start Supabase
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Database
        run: supabase start -x realtime,storage-api,imgproxy,studio,mailpit,edge-runtime,logflare,vector

      # The pg pool bypasses RLS, so `where company_id = $n` in each statement is
      # the primary access control. The static check asserts no statement is
      # missing one; the integration suite proves the predicates are also right.
      - name: Test
        run: npm run test
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # Build-time values only — src/lib/env.ts validates at boot, so the
          # build needs syntactically valid placeholders, not real secrets.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-for-build-only
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key-build-only
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

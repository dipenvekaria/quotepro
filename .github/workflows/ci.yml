name: CI

on:
  push:
    branches: [rebuild/main]
  pull_request:
    branches: [rebuild/main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# This pipeline reflects what the repo actually runs today: npm, eslint, and a
# typecheck scoped to live code via tsconfig.ci.json.
#
# The target toolchain is pnpm + biome + vitest + uv + ruff (docs/adr/0006).
# Swap this file over as part of Cleanup Phase 3 — not before, or CI goes red on
# tooling that isn't installed yet.

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      # Scoped to the live app. The pre-rebuild tree does not compile — that is
      # why next.config.ts still sets ignoreBuildErrors. See docs/CODEBASE_MAP.md.
      - name: Typecheck (live code)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # Build-time values only — src/lib/env.ts validates at boot, so the
          # build needs syntactically valid placeholders, not real secrets.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-for-build-only
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key-build-only
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          BACKEND_INTERNAL_URL: http://localhost:8000

  backend:
    name: AI service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      # ai_backend.py raises at import time without Supabase config, so this is
      # a syntax/dependency check rather than a boot check. Real tests land in
      # Cleanup Phase 4.
      - name: Compile check
        run: python -m compileall -q ai_backend.py
